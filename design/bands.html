<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShackWall HF band panel samples</title>
<!-- Four ways to draw the HF bands panel, each at the size the real page gives
     it: 36.3 x 18.2 rem on a 16:9 TV and 33.8 x 17.1 rem on an iPad. Served
     beside ../frontend so the samples use the page's own stylesheet. -->
<link rel="stylesheet" href="../frontend/app.css">
<style>
  html { font-size: 16px; }
  body { width: auto; height: auto; overflow: auto; padding: 24px; display: block; }
  .row { display: flex; gap: 32px; margin-bottom: 40px; align-items: flex-start; }
  .label { font-size: 28px; font-weight: 700; width: 40px; }
  .box { position: relative; }
  .box .panel { width: 100%; height: 100%; }
  .measure { font: 13px Consolas, monospace; color: var(--dim); margin-top: 6px; }
  .tv { width: 36.3rem; height: 18.2rem; }
  .ipad { width: 33.8rem; height: 17.1rem; }

  .src { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .foot { margin-top: auto; font-size: 1.3rem; color: var(--dim); }
  .foot b { color: var(--text); font-weight: 600; }

  /* A: a table of words, the column for now bright, the other dimmed */
  .A table { border-collapse: collapse; width: 100%; font-size: 1.6rem; }
  .A th { font-size: 1.2rem; font-weight: 600; color: var(--dim); text-align: left;
          text-transform: uppercase; letter-spacing: 0.1em; padding-bottom: 0.3rem; }
  .A th.now { color: var(--accent); }
  .A td { padding: 0.15rem 0; font-weight: 600; }
  .A td.band { color: var(--text); font-weight: 400; width: 40%; }
  .A td.later { opacity: 0.45; }

  /* B: filled cells, coloured by condition */
  .B .grid { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 0.4rem; font-size: 1.5rem; }
  .B .h { font-size: 1.2rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
  .B .h.now { color: var(--accent); }
  .B .c { border-radius: 0.3rem; text-align: center; font-weight: 700; color: var(--bg); padding: 0.1rem 0; }
  .B .c.later { opacity: 0.4; }
  .B .bg-good { background: var(--good); } .B .bg-fair { background: var(--fair); } .B .bg-poor { background: var(--poor); }

  /* C: only what the bands are doing now, large; the other half of the day small */
  .C ul { list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }
  .C li { display: grid; grid-template-columns: 9rem 1fr auto; align-items: baseline; }
  .C .band { font-size: 1.6rem; }
  .C .cond { font-size: 2.1rem; font-weight: 700; }
  .C .later { font-size: 1.2rem; color: var(--dim); }

  /* D: one column per band pair, day cell above night cell */
  .D .cols { display: grid; grid-template-columns: auto repeat(4, 1fr); gap: 0.4rem; align-items: center; }
  .D .side { font-size: 1.2rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; padding-right: 0.4rem; }
  .D .side.now { color: var(--accent); }
  .D .c { border-radius: 0.3rem; text-align: center; font-weight: 700; font-size: 1.4rem;
          color: var(--bg); padding: 0.5rem 0; }
  .D .c.later { opacity: 0.4; }
  .D .name { font-size: 1.3rem; text-align: center; }
  .D .bg-good { background: var(--good); } .D .bg-fair { background: var(--fair); } .D .bg-poor { background: var(--poor); }
</style>
</head>
<body>
<div id="out"></div>
<script>
// The feed as fetched 2026-11-02 14:22 UTC. The sun is up at the station.
const data = {
  bands: [
    { name: '80m-40m', day: 'Fair', night: 'Good' },
    { name: '30m-20m', day: 'Good', night: 'Good' },
    { name: '17m-15m', day: 'Fair', night: 'Fair' },
    { name: '12m-10m', day: 'Poor', night: 'Poor' },
  ],
  noise: 'S1-S2',
};
const now = 'day', later = 'night';
const cls = c => c.toLowerCase();
const short = n => n.replace(/m-/, '–');                 // 80m-40m -> 80–40m
// The noise level shares the title line: a line of its own doesn't fit on an iPad.
const head = `<h2>HF bands <span class="src">Noise ${data.noise} · HAMQSL.com</span></h2>`;
const foot = '';

const variants = {
  A: () => `<table><tr><th>Band</th><th class="now">Day</th><th>Night</th></tr>` +
    data.bands.map(b => `<tr><td class="band">${short(b.name)}</td>
      <td class="${cls(b.day)}">${b.day}</td><td class="${cls(b.night)} later">${b.night}</td></tr>`).join('') +
    `</table>`,
  B: () => `<div class="grid"><div></div><div class="h now">Day</div><div class="h">Night</div>` +
    data.bands.map(b => `<div>${short(b.name)}</div>
      <div class="c bg-${cls(b.day)}">${b.day}</div><div class="c bg-${cls(b.night)} later">${b.night}</div>`).join('') +
    `</div>`,
  C: () => `<ul>` + data.bands.map(b => `<li><span class="band">${short(b.name)}</span>
      <span class="cond ${cls(b[now])}">${b[now]}</span><span class="later">tonight ${b[later]}</span></li>`).join('') +
    `</ul>`,
  D: () => `<div class="cols"><div></div>` +
    data.bands.map(b => `<div class="name">${short(b.name)}</div>`).join('') +
    `<div class="side now">Day</div>` + data.bands.map(b => `<div class="c bg-${cls(b.day)}">${b.day}</div>`).join('') +
    `<div class="side">Night</div>` + data.bands.map(b => `<div class="c bg-${cls(b.night)} later">${b.night}</div>`).join('') +
    `</div>`,
};

const out = document.getElementById('out');
for (const [k, body] of Object.entries(variants)) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="label">${k}</div>` + ['tv', 'ipad'].map(size =>
    `<div><div class="box ${size}" id="${k}-${size}"><section class="panel ${k}">${head}${body()}${foot}</section></div>
     <div class="measure" id="m-${k}-${size}"></div></div>`).join('');
  out.appendChild(row);
}

// Measured, in rem: the smallest text, whether anything is cut off, and how
// much of the panel's content area the content fills.
for (const box of document.querySelectorAll('.box')) {
  const panel = box.querySelector('.panel');
  let min = Infinity, overflow = false;
  const pr = panel.getBoundingClientRect();
  for (const el of panel.querySelectorAll('*')) {
    if ([...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim()))
      min = Math.min(min, parseFloat(getComputedStyle(el).fontSize));
    const r = el.getBoundingClientRect();
    if (r.bottom > pr.bottom - 1 || r.right > pr.right - 1) overflow = true;
  }
  const last = panel.lastElementChild.getBoundingClientRect();
  const fill = (last.bottom - pr.top) / pr.height;
  document.getElementById('m-' + box.id).textContent =
    `${box.id}: min ${(min / 16).toFixed(2)}rem, ${overflow ? 'CLIPPED' : 'fits'}, bands end at ${(fill * 100).toFixed(0)}%`;
}
</script>
</body>
</html>
