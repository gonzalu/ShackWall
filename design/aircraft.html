<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShackWall aircraft page samples</title>
<!-- Four ways to draw the aircraft page in the big feature panel at the size
     the real page gives it: 79.8 x 58.4 rem on a 16:9 TV and 117 x 62.7 rem on
     an iPad in landscape, drawn at half scale (1rem = 8px). The maps are the
     same live OpenFreeMap map as the APRS page, so view this in a real browser
     with internet. -->
<link rel="stylesheet" href="../frontend/app.css">
<script src="aircraft-data.js"></script>
<style>
  html { font-size: 8px; }
  body { width: auto; height: auto; overflow: auto; padding: 16px; display: block; }
  .row { display: flex; gap: 20px; margin-bottom: 28px; align-items: flex-start; }
  .label { font-size: 24px; font-weight: 700; width: 28px; }
  .box .panel { width: 100%; height: 100%; }
  .measure { font: 12px Consolas, monospace; color: var(--dim); margin-top: 4px; }
  .tv { width: 79.8rem; height: 58.4rem; }
  .ipad { width: 117rem; height: 62.7rem; }
  .feature-body { display: flex; flex-direction: column; gap: 1rem; }
  .mono { font-family: Consolas, "SF Mono", Menlo, monospace; }
  .mapbox { position: relative; min-height: 0; overflow: hidden; border-radius: 0.4rem; background: #111b21; }
  .mapbox .gl, .mapbox svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .credit-map { position: absolute; right: 0.4rem; bottom: 0.3rem; font-size: 1.2rem; color: var(--dim); }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 1.6rem; }
  .list { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .more { font-size: 1.3rem; color: var(--dim); padding-top: 0.3rem; }
  .pl { display: grid; grid-template-columns: 1fr auto; gap: 0 1rem; padding: 0.4rem 0; border-top: 1px solid var(--line); }
  .pl .f { font-size: 1.6rem; font-weight: 700; }
  .pl .alt { font-size: 1.6rem; text-align: right; white-space: nowrap; }
  .pl .sub { font-size: 1.3rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl .d { font-size: 1.3rem; color: var(--dim); text-align: right; white-space: nowrap; }
  /* B: a departures-board list */
  .board { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .board th { font-size: 1.2rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; text-align: left; font-weight: 600; padding: 0 1rem 0.4rem 0; }
  .board td { font-size: 1.8rem; padding: 0.55rem 1rem 0.55rem 0; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board td.f { font-weight: 700; font-size: 2rem; }
  .board .dim { color: var(--dim); font-size: 1.5rem; }
  /* D: the nearest aircraft, large */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 2rem; flex: 1; min-height: 0; }
  .card .k { font-size: 1.3rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
  .card .big { font-size: 5.5rem; font-weight: 700; line-height: 1; }
  .card .route { font-size: 2.6rem; margin-top: 0.6rem; }
  .card .facts { font-size: 1.9rem; line-height: 1.6; margin-top: 1rem; }
  .card .facts span { color: var(--dim); }
  .next { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; border-top: 1px solid var(--line); padding-top: 0.8rem; }
  .next > div { min-width: 0; }
  .next b { font-size: 1.7rem; display: block; }
  .next span { font-size: 1.3rem; color: var(--dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="out"></div>
<script>
const HOME = SNAPSHOT.home, planes = SNAPSHOT.aircraft.aircraft;
const DIR8 = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const dir = b => DIR8[Math.round(b / 45) % 8];
const mi = km => km < 10 ? (km / 1.609344).toFixed(1) : Math.round(km / 1.609344);
const name = p => p.flight || p.registration || p.hex.toUpperCase();
const alt = p => p.on_ground ? 'ground' : `${Math.round(p.alt_baro / 100) * 100 >= 18000 ? 'FL' + Math.round(p.alt_baro / 100) : (Math.round(p.alt_baro / 100) * 100).toLocaleString() + ' ft'}`;
const climb = p => p.baro_rate > 300 ? ' ↑' : p.baro_rate < -300 ? ' ↓' : '';
const route = p => p.origin ? `${p.origin} → ${p.destination}` : '';
const about = p => [route(p), p.airline, p.type].filter(Boolean).join(' · ');
const BLUE = '#3987e5';
// Far enough to hold nine aircraft in ten.
const ds = planes.map(p => p.km).sort((a, b) => a - b);
const RANGE_KM = Math.max(20, Math.ceil(ds[Math.floor(ds.length * 0.9)] / 10) * 10);

function plane(x, y, track, r, colour) {
  const a = (track || 0) * Math.PI / 180;
  const p = (dx, dy) => `${(x + dx * Math.cos(a) - dy * Math.sin(a)).toFixed(1)},${(y + dx * Math.sin(a) + dy * Math.cos(a)).toFixed(1)}`;
  // A simple airliner seen from above: fuselage, wings, tail.
  const pts = [[0, -1.6], [0.2, -0.6], [1.5, 0.1], [1.5, 0.4], [0.2, 0], [0.15, 1], [0.6, 1.4], [0.6, 1.6], [0, 1.4],
               [-0.6, 1.6], [-0.6, 1.4], [-0.15, 1], [-0.2, 0], [-1.5, 0.4], [-1.5, 0.1], [-0.2, -0.6]];
  return `<polygon points="${pts.map(([dx, dy]) => p(dx * r, dy * r)).join(' ')}" fill="${colour}" stroke="#0b0e12" stroke-width="1"/>`;
}

function overlay(svg, project, rem, labels) {
  const W = svg.clientWidth, H = svg.clientHeight;
  const [hx, hy] = project(HOME[0], HOME[1]);
  const kmPerLon = 111.32 * Math.cos(HOME[0] * Math.PI / 180);
  const kmPx = (project(HOME[0], HOME[1] + 20 / kmPerLon)[0] - hx) / 20;
  let g = '';
  for (const m of [10, 25, 40]) if (m * 1.609344 < RANGE_KM * 1.3) {
    const r = m * 1.609344 * kmPx;
    g += `<circle cx="${hx}" cy="${hy}" r="${r}" fill="none" stroke="#3a4a5c" stroke-dasharray="4 5"/>` +
         `<text x="${hx + 0.4 * rem}" y="${hy - r - 0.3 * rem}" fill="var(--dim)" font-size="${1.2 * rem}">${m} mi</text>`;
  }
  const placed = [];
  const free = b => placed.every(q => b[0] > q[2] || b[2] < q[0] || b[1] > q[3] || b[3] < q[1]);
  for (const p of [...planes].reverse()) {
    const [x, y] = project(p.lat, p.lon);
    if (x < 0 || y < 0 || x > W || y > H) continue;
    g += plane(x, y, p.track, 0.65 * rem, p.on_ground ? '#8b98a5' : BLUE);
  }
  if (labels) for (const p of planes) {
    const [x, y] = project(p.lat, p.lon);
    const text = `${name(p)} ${p.on_ground ? 'gnd' : Math.round(p.alt_baro / 100)}`;
    const box = [x + 1.1 * rem, y - 0.6 * rem, x + 1.1 * rem + text.length * 0.62 * 1.2 * rem, y + 0.7 * rem];
    if (box[2] > W || box[0] < 0 || box[1] < 0 || box[3] > H || !free(box)) continue;
    placed.push(box);
    g += `<text x="${box[0]}" y="${y + 0.45 * rem}" fill="var(--text)" font-size="${1.2 * rem}" paint-order="stroke" stroke="#0b0e12" stroke-width="3">${text}</text>`;
  }
  g += `<circle cx="${hx}" cy="${hy}" r="${0.6 * rem}" fill="var(--text)" stroke="#0b0e12" stroke-width="2"/>`;
  svg.innerHTML = g;
}

const LIVE_HIDE = ['highway_path', 'highway_minor', 'highway_major_casing', 'highway_major_inner', 'highway_major_subtle',
  'highway_name_other', 'highway_motorway_casing', 'highway_motorway_inner', 'highway_motorway_subtle', 'highway_name_motorway',
  'railway', 'railway_dashline', 'railway_minor', 'railway_minor_dashline', 'railway_transit', 'railway_transit_dashline',
  'building', 'road_oneway', 'road_oneway_opposite', 'road_pier', 'road_area_pier', 'boundary_state', 'boundary_country_z0-4', 'boundary_country_z5-'];
const LIVE_PAINT = { background: ['background-color', '#111b21'], water: ['fill-color', '#060b0e'], waterway: ['line-color', '#060b0e'],
  landuse_residential: ['fill-color', '#111b21'], landuse_park: ['fill-color', '#162229'], landcover_wood: ['fill-color', '#162229'] };
function liveMap(box, labels) {
  return new Promise(resolve => {
    const gl = box.querySelector('.gl'), svg = box.querySelector('svg');
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    const half = Math.min(gl.clientWidth, gl.clientHeight) / 2;
    const zoom = Math.log2(40075016.686 * Math.cos(HOME[0] * Math.PI / 180) / (512 * RANGE_KM * 1000 / half));
    const map = new maplibregl.Map({ container: gl, style: 'https://tiles.openfreemap.org/styles/dark', center: [HOME[1], HOME[0]],
      zoom, interactive: false, attributionControl: false, fadeDuration: 0 });
    map.once('load', () => {
      for (const layer of map.getStyle().layers) {
        if (LIVE_HIDE.includes(layer.id)) map.setLayoutProperty(layer.id, 'visibility', 'none');
        else if (layer.id.startsWith('place_')) map.setPaintProperty(layer.id, 'text-opacity', 0.45);
        else if (LIVE_PAINT[layer.id]) map.setPaintProperty(layer.id, ...LIVE_PAINT[layer.id]);
      }
      overlay(svg, (lat, lon) => { const q = map.project([lon, lat]); return [q.x, q.y]; }, rem, labels);
      map.once('idle', resolve);
    });
  });
}

const MAPCREDIT = '<div class="credit-map">© OpenMapTiles © OpenStreetMap contributors</div>';
const mapBox = (labels, style = '') => `<div class="mapbox" ${labels ? 'data-labels="1"' : ''} style="${style}"><div class="gl"></div><svg></svg>${MAPCREDIT}</div>`;
const row = p => `<div class="pl"><span class="f mono">${name(p)}</span><span class="alt">${alt(p)}${climb(p)}</span>
  <span class="sub">${about(p) || '&nbsp;'}</span><span class="d">${mi(p.km)} mi ${dir(p.bearing)}</span></div>`;

const variants = {
  A: () => `<div class="split">${mapBox(false)}<div class="list" data-total="${planes.length}">${planes.slice(0, 20).map(row).join('')}</div></div>`,
  B: () => `<table class="board"><colgroup><col style="width:16%"><col style="width:30%"><col style="width:22%"><col style="width:16%"><col></colgroup>
    <tr><th>Flight</th><th>Route</th><th>Aircraft</th><th>Altitude</th><th>Where</th></tr>` +
    planes.slice(0, 13).map(p => `<tr><td class="f mono">${name(p)}</td>
      <td>${p.origin ? `${p.origin} → ${p.destination} <span class="dim">${p.to_city || ''}</span>` : '<span class="dim">—</span>'}</td>
      <td>${p.type || '—'} <span class="dim">${p.airline || ''}</span></td><td>${alt(p)}${climb(p)}</td><td>${mi(p.km)} mi ${dir(p.bearing)}</td></tr>`).join('') + `</table>`,
  C: () => mapBox(true, 'flex:1'),
  D: () => { const p = planes[0];
    return `<div class="hero">${mapBox(false)}<div class="card"><div class="k">Nearest · ${mi(p.km)} mi ${dir(p.bearing)}</div>
      <div class="big mono">${name(p)}</div><div class="route">${route(p) ? `${route(p)} · ${p.from_city} to ${p.to_city}` : (p.airline || '')}</div>
      <div class="facts">${alt(p)}${climb(p)} <span>altitude</span><br>${Math.round(p.gs || 0)} kn <span>heading ${dir(p.track || 0)}</span><br>
      ${[p.type, p.registration].filter(Boolean).join(' · ')} <span>${p.airline || ''}</span></div></div></div>
      <div class="next">` + planes.slice(1, 6).map(q => `<div><b class="mono">${name(q)}</b><span>${alt(q)} · ${mi(q.km)} mi ${dir(q.bearing)}</span><span>${about(q)}</span></div>`).join('') + `</div>`; },
};

(async () => {
  const lib = document.createElement('script');
  lib.src = 'https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js';
  document.head.append(Object.assign(document.createElement('link'), { rel: 'stylesheet', href: 'https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css' }), lib);
  await new Promise(r => lib.onload = r);
  const out = document.getElementById('out');
  for (const [k, body] of Object.entries(variants)) {
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = `<div class="label">${k}</div>` + ['tv', 'ipad'].map(size =>
      `<div><div class="box ${size}" id="${k}-${size}"><section class="panel feature">
         <h2>Aircraft · ${planes.length} within ${mi(RANGE_KM)} mi · via FlightBoard</h2><div class="feature-body">${body()}</div></section></div>
       <div class="measure" id="m-${k}-${size}"></div></div>`).join('');
    out.appendChild(el);
  }
  await Promise.all([...document.querySelectorAll('.mapbox')].map(b => liveMap(b, !!b.dataset.labels)));
  for (const col of document.querySelectorAll('.list')) {
    const items = [...col.children], bottom = () => col.getBoundingClientRect().bottom;
    while (items.length && items[items.length - 1].getBoundingClientRect().bottom > bottom()) items.pop().remove();
    if (+col.dataset.total > items.length) {
      const more = Object.assign(document.createElement('div'), { className: 'more' });
      col.appendChild(more);
      while (items.length && more.getBoundingClientRect().bottom > bottom()) items.pop().remove();
      more.textContent = `+${col.dataset.total - items.length} more`;
    }
  }
  const remPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
  for (const box of document.querySelectorAll('.box')) {
    const body = box.querySelector('.feature-body'), br = body.getBoundingClientRect();
    let min = Infinity, outside = 0;
    for (const el of body.querySelectorAll('*')) {
      if (el.closest('.gl')) continue;
      if ([...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim()))
        min = Math.min(min, parseFloat(el.getAttribute('font-size') || getComputedStyle(el).fontSize));
      const r = el.getBoundingClientRect();
      if (r.height && !el.closest('svg') && (r.bottom > br.bottom + 1 || r.right > br.right + 1)) outside++;
    }
    const labels = box.querySelectorAll('.mapbox svg text').length;
    document.getElementById('m-' + box.id).textContent =
      `${box.id}: min ${(min / remPx).toFixed(2)}rem, ${outside ? outside + ' outside' : 'fits'}, ${box.querySelectorAll('.pl, .board tr').length} rows, ${labels} map labels`;
  }
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
