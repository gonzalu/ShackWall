<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShackWall POTA page samples</title>
<!-- Four ways to draw the POTA spots page in the big feature panel at the size
     the real page gives it: 79.8 x 58.4 rem on a 16:9 TV and 117 x 62.7 rem
     on an iPad in landscape, drawn at half scale (1rem = 8px). The coastline
     is Natural Earth's 1:110m land (public domain) as packaged by world-atlas
     (ISC). -->
<link rel="stylesheet" href="../frontend/app.css">
<script src="pota-data.js"></script>
<style>
  html { font-size: 8px; }
  body { width: auto; height: auto; overflow: auto; padding: 16px; display: block; }
  .row { display: flex; gap: 20px; margin-bottom: 28px; align-items: flex-start; }
  .label { font-size: 24px; font-weight: 700; width: 28px; }
  .box .panel { width: 100%; height: 100%; }
  .measure { font: 12px Consolas, monospace; color: var(--dim); margin-top: 4px; }
  .tv { width: 79.8rem; height: 58.4rem; }
  .ipad { width: 117rem; height: 62.7rem; }
  .feature-body { display: flex; flex-direction: column; gap: 1rem; }
  .dim { color: var(--dim); }
  .mono { font-family: Consolas, "SF Mono", Menlo, monospace; }

  /* A: a table, newest first */
  .stbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .stbl th { font-size: 1.2rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; text-align: left; padding: 0 1rem 0.4rem 0; }
  .stbl td { font-size: 1.7rem; padding: 0.5rem 1rem 0.5rem 0; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stbl .call { font-weight: 700; }
  .stbl .park { color: var(--dim); }

  /* B: a map round the station beside a list */
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem; }
  .map { width: 100%; height: 100%; min-height: 0; }
  .list { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .it { display: grid; grid-template-columns: 1fr auto; gap: 0 1rem; padding: 0.45rem 0; border-top: 1px solid var(--line); }
  .it .call { font-size: 1.7rem; font-weight: 700; }
  .it .f { font-size: 1.7rem; text-align: right; }
  .it .sub { font-size: 1.3rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .d { font-size: 1.3rem; color: var(--dim); text-align: right; }

  /* C: a column per band */
  .bands { flex: 1; min-height: 0; display: grid; gap: 1rem; }
  .bcol { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; overflow: hidden; }
  .bcol h3 { font-size: 2rem; font-weight: 700; border-bottom: 2px solid var(--accent); padding-bottom: 0.2rem; }
  .bcol .s { font-size: 1.5rem; }
  .bcol .s b { display: block; }
  .bcol .s span { font-size: 1.3rem; color: var(--dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* D: nearest first, large */
  .near { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 2.4rem; }
  .n { display: grid; grid-template-columns: 6rem 1fr auto; gap: 0 1rem; align-items: baseline; padding: 0.5rem 0; border-top: 1px solid var(--line); min-width: 0; }
  .n .dist { font-size: 2.2rem; font-weight: 700; }
  .n .call { font-size: 2rem; font-weight: 700; }
  .n .f { font-size: 1.8rem; }
  .n .sub { grid-column: 2 / -1; font-size: 1.3rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n .brg { grid-column: 1; font-size: 1.3rem; color: var(--dim); }
</style>
</head>
<body>
<div id="out"></div>
<script>
const NOW = SNAPSHOT.server_time * 1000, HOME = [40.8958, -73.875];
const spots = SNAPSHOT.spots.filter(s => !s.qrt);
const DIR8 = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const dir = b => DIR8[Math.round(b / 45) % 8];
const mi = km => Math.round(km * 0.621371);
const age = s => `${Math.max(0, Math.round((NOW - new Date(s.time)) / 60000))} min`;
const freq = s => s.khz.toFixed(1).replace(/\.0$/, '');
const where = s => (s.location || '').split(',')[0];
const SERIES = ['#3987e5', '#d95926', '#199e70'];

// Azimuthal equidistant map round the station: every spot sits at its true
// distance and great-circle bearing, the way a beam would point.
let LAND = null;
async function loadLand() {
  const topo = await (await fetch('../frontend/land-110m.json')).json();
  const { scale: [kx, ky], translate: [dx, dy] } = topo.transform;
  const arcs = topo.arcs.map(arc => { let x = 0, y = 0; return arc.map(([a, b]) => [(x += a) * kx + dx, (y += b) * ky + dy]); });
  const ring = idx => idx.flatMap((i, n) => { const a = i < 0 ? arcs[~i].slice().reverse() : arcs[i]; return n ? a.slice(1) : a; });
  LAND = topo.objects.land.geometries.flatMap(g => g.type === 'Polygon' ? g.arcs.map(ring) : g.arcs.flatMap(p => p.map(ring)));
}
function project(lat, lon) {
  const r = Math.PI / 180, p1 = HOME[0] * r, p2 = lat * r, dl = (lon - HOME[1]) * r;
  const c = Math.acos(Math.max(-1, Math.min(1, Math.sin(p1) * Math.sin(p2) + Math.cos(p1) * Math.cos(p2) * Math.cos(dl))));
  const b = Math.atan2(Math.sin(dl) * Math.cos(p2), Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl));
  const km = c * 6371;
  return [km * Math.sin(b), -km * Math.cos(b), km];
}
function drawMap(svg, list) {
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const W = svg.clientWidth, H = svg.clientHeight, S = Math.min(W, H), cx = W / 2, cy = H / 2;
  // Far enough to hold nine spots in ten; the rest wait at the rim.
  const ds = list.map(s => s.km).sort((a, b) => a - b);
  const maxKm = Math.max(1500, Math.ceil(ds[Math.floor(ds.length * 0.9)] / 500) * 500);
  const k = (S / 2 - 1.5 * rem) / maxKm;
  let g = `<clipPath id="c${svg.id}"><circle cx="${cx}" cy="${cy}" r="${maxKm * k}"/></clipPath>`;
  g += `<circle cx="${cx}" cy="${cy}" r="${maxKm * k}" fill="#0f141a" stroke="var(--line)"/>`;
  let d = '';
  for (const ring of LAND) {
    let pen = false;
    for (const [lon, lat] of ring) {
      const [x, y, km] = project(lat, lon);
      if (km > maxKm * 1.6) { pen = false; continue; }
      d += `${pen ? 'L' : 'M'}${(cx + x * k).toFixed(1)},${(cy + y * k).toFixed(1)}`;
      pen = true;
    }
  }
  g += `<path d="${d}" fill="none" stroke="#3a4a5c" stroke-width="1.2" clip-path="url(#c${svg.id})"/>`;
  // Range rings in round miles, every 1,000 (500 when the map is small).
  const stepMi = maxKm > 4000 ? 1000 : 500;
  for (let m = stepMi; m / 0.621371 < maxKm; m += stepMi) {
    const r = m / 0.621371 * k;
    g += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-dasharray="3 4"/>`;
    g += `<text x="${cx + 0.4 * rem}" y="${cy - r - 0.3 * rem}" fill="var(--dim)" font-size="${1.2 * rem}">${m.toLocaleString()} mi</text>`;
  }
  for (const s of list) {
    let [x, y, km] = project(s.lat, s.lon);
    const out = km > maxKm;
    if (out) { x *= maxKm / km; y *= maxKm / km; }
    g += `<circle cx="${cx + x * k}" cy="${cy + y * k}" r="${(out ? 0.5 : 0.7) * rem}" fill="${out ? 'var(--dim)' : SERIES[0]}" stroke="var(--panel)" stroke-width="1.5"/>`;
  }
  g += `<circle cx="${cx}" cy="${cy}" r="${0.6 * rem}" fill="var(--text)"/>`;
  svg.innerHTML = g;
}

const BAND_ORDER = ['160m', '80m', '60m', '40m', '30m', '20m', '17m', '15m', '12m', '10m', '6m', '2m', '70cm'];
const variants = {
  A: () => `<table class="stbl"><colgroup><col style="width:8%"><col style="width:13%"><col style="width:11%"><col style="width:8%"><col><col style="width:8%"><col style="width:13%"></colgroup>
    <tr><th>Spotted</th><th>Activator</th><th>kHz</th><th>Mode</th><th>Park</th><th>Where</th><th>Distance</th></tr>` +
    spots.slice(0, 14).map(s => `<tr><td class="dim">${age(s)}</td><td class="call mono">${s.activator}</td><td>${freq(s)}</td><td>${s.mode}</td>
      <td><span class="mono">${s.reference}</span> <span class="park">${s.park}</span></td><td>${where(s)}</td><td>${mi(s.km)} mi ${dir(s.bearing)}</td></tr>`).join('') + `</table>`,
  B: () => `<div class="split"><svg class="map"></svg><div class="list" data-total="${spots.length}">` +
    spots.slice(0, 11).map(s => `<div class="it"><span class="call mono">${s.activator}</span><span class="f">${freq(s)} ${s.mode}</span>
      <span class="sub"><span class="mono">${s.reference}</span> ${s.park}</span><span class="d">${mi(s.km)} mi ${dir(s.bearing)}</span></div>`).join('') + `</div></div>`,
  C: () => { const bands = BAND_ORDER.filter(b => spots.some(s => s.band === b));
    return `<div class="bands" style="grid-template-columns:repeat(${bands.length},1fr)">` + bands.map(b => `<div class="bcol" data-total="${spots.filter(s => s.band === b).length}"><h3>${b}</h3>` +
      spots.filter(s => s.band === b).map(s => `<div class="s"><b><span class="mono" style="display:inline;font-size:inherit;color:var(--text)">${s.activator}</span> ${freq(s)}</b>
        <span>${s.mode} · ${s.reference} · ${where(s)}</span></div>`).join('') + `</div>`).join('') + `</div>`; },
  D: () => `<div class="near">` + spots.slice().sort((a, b) => a.km - b.km).slice(0, 16).map(s => `<div class="n">
      <span class="dist">${mi(s.km)}</span><span class="call mono">${s.activator}</span><span class="f">${freq(s)} ${s.mode}</span>
      <span class="brg">mi ${dir(s.bearing)}</span><span class="sub"><span class="mono">${s.reference}</span> ${s.park}, ${where(s)}</span></div>`).join('') + `</div>`,
};
const titles = { A: 'POTA spots · newest first', B: 'POTA spots · newest first', C: 'POTA spots · by band', D: 'POTA spots · nearest first' };

(async () => {
  await loadLand();
  const out = document.getElementById('out');
  for (const [k, body] of Object.entries(variants)) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="label">${k}</div>` + ['tv', 'ipad'].map(size =>
      `<div><div class="box ${size}" id="${k}-${size}"><section class="panel feature">
         <h2>${titles[k]} · ${spots.length} on air</h2><div class="feature-body">${body()}</div></section></div>
       <div class="measure" id="m-${k}-${size}"></div></div>`).join('');
    out.appendChild(row);
  }
  document.querySelectorAll('svg.map').forEach((svg, i) => { svg.id = 'map' + i; drawMap(svg, spots); });
  // Lists and band columns keep as many spots as fit, then say how many more.
  for (const col of document.querySelectorAll('.list, .bcol')) {
    const items = [...col.children].filter(e => e.tagName !== 'H3');
    const bottom = () => col.getBoundingClientRect().bottom;
    let dropped = 0;
    while (items.length && items[items.length - 1].getBoundingClientRect().bottom > bottom()) { items.pop().remove(); dropped++; }
    if (dropped || +col.dataset.total > items.length) {
      const more = document.createElement('div');
      more.className = 'more';
      more.style.cssText = 'font-size:1.3rem;color:var(--dim);padding-top:0.3rem';
      col.appendChild(more);
      while (items.length && more.getBoundingClientRect().bottom > bottom()) { items.pop().remove(); dropped++; }
      more.textContent = `+${+col.dataset.total - items.length} more`;
    }
  }

  // Measured: smallest text, anything outside the panel, text cut short, where content ends.
  const remPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
  for (const box of document.querySelectorAll('.box')) {
    const body = box.querySelector('.feature-body'), br = body.getBoundingClientRect();
    let min = Infinity, outside = 0, bottom = 0, cut = 0, hidden = 0;
    for (const el of body.querySelectorAll('*')) {
      if ([...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) {
        min = Math.min(min, parseFloat(el.getAttribute('font-size') || getComputedStyle(el).fontSize));
        if (el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).textOverflow === 'ellipsis') cut++;
      }
      const r = el.getBoundingClientRect();
      if (!r.height || el.closest('svg')) continue;
      if (r.top > br.bottom - 1 || r.bottom > br.bottom + 1) { if (el.closest('.bcol, .list')) hidden++; else outside++; }
      else bottom = Math.max(bottom, r.bottom);
    }
    document.getElementById('m-' + box.id).textContent =
      `${box.id}: min ${(min / remPx).toFixed(2)}rem, ${outside ? outside + ' outside' : 'fits'}${hidden ? `, ${hidden} cut off the bottom of a column` : ''}${cut ? `, ${cut} shortened` : ''}, content ends at ${(100 * (bottom - br.top) / br.height).toFixed(0)}%`;
  }
})();
</script>
</body>
</html>
