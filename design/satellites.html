<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShackWall satellite page samples</title>
<!-- Four ways to draw the satellite page in the big feature panel at the size
     the real page gives it: 79.8 x 58.4 rem on a 16:9 TV and 117 x 62.7 rem
     on an iPad in landscape, drawn at half scale (1rem = 8px). The clock is
     frozen at the snapshot's time, when an RS-44 pass is under way. -->
<link rel="stylesheet" href="../frontend/app.css">
<script src="satellites-data.js"></script>
<style>
  html { font-size: 8px; }
  body { width: auto; height: auto; overflow: auto; padding: 16px; display: block; }
  .row { display: flex; gap: 20px; margin-bottom: 28px; align-items: flex-start; }
  .label { font-size: 24px; font-weight: 700; width: 28px; }
  .box .panel { width: 100%; height: 100%; }
  .measure { font: 12px Consolas, monospace; color: var(--dim); margin-top: 4px; }
  .tv { width: 79.8rem; height: 58.4rem; }
  .ipad { width: 117rem; height: 62.7rem; }
  .feature-body { display: flex; flex-direction: column; gap: 1.2rem; }
  .now { color: var(--accent); }
  .dim { color: var(--dim); }
  svg text { font-family: inherit; }

  /* A: a table of the next passes */
  .ptbl { width: 100%; border-collapse: collapse; }
  .ptbl th { font-size: 1.2rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; text-align: left; padding: 0 1rem 0.4rem 0; }
  .ptbl td { font-size: 1.7rem; padding: 0.55rem 1rem 0.55rem 0; border-top: 1px solid var(--line); white-space: nowrap; }
  .ptbl td.sat { font-weight: 700; font-size: 1.9rem; }
  .ptbl tr.live td { background: rgba(88, 166, 255, 0.10); }
  .ptbl .freq { color: var(--dim); font-size: 1.5rem; }

  /* B: sky plot of the next passes beside a list */
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.9fr) 1fr; gap: 2rem; }
  .sky { width: 100%; height: 100%; min-height: 0; }
  .list { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .list .it { display: grid; grid-template-columns: 1.2rem 8rem 1fr auto; gap: 0.8rem; align-items: baseline; font-size: 1.7rem;
              padding: 0.45rem 0; border-top: 1px solid var(--line); }
  .list .it .sat { font-weight: 700; }
  .list .it i { width: 1rem; height: 1rem; border-radius: 50%; display: inline-block; }
  .list .sub { grid-column: 3 / -1; font-size: 1.3rem; color: var(--dim); }

  /* C: a 12-hour timeline, a lane per satellite */
  .tl { flex: 1; min-height: 0; }
  .detail { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 1.6rem; font-size: 1.7rem; }
  .detail .k { font-size: 1.3rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; align-self: baseline; }

  /* D: the next pass, large, then the ones after */
  .hero { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.9fr) 1fr; gap: 2.4rem; }
  .hero .k { font-size: 1.3rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
  .hero .big { font-size: 6rem; font-weight: 700; line-height: 1; }
  .hero .when { font-size: 2.6rem; margin-top: 0.4rem; }
  .hero .facts { font-size: 1.9rem; line-height: 1.6; margin-top: 1.2rem; }
  .hero .freqs { font-size: 1.7rem; color: var(--dim); margin-top: 1rem; line-height: 1.5; }
  .later { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; border-top: 1px solid var(--line); padding-top: 1rem; }
  .later .sat { font-size: 1.8rem; font-weight: 700; }
  .later .t { font-size: 1.6rem; }
  .later .sub { font-size: 1.3rem; color: var(--dim); }
</style>
</head>
<body>
<div id="out"></div>
<script>
const TZ = SNAPSHOT.timezone, NOW = SNAPSHOT.server_time * 1000;
const passes = SNAPSHOT.passes, sats = Object.fromEntries(SNAPSHOT.satellites.map(s => [s.norad, s]));
const SERIES = ['#3987e5', '#d95926', '#199e70'];
const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const dir = az => COMPASS[Math.round(az / 45) % 8];
const t = iso => new Date(iso).getTime();
const clock = iso => new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: TZ });
const mins = ms => Math.round(ms / 60000);
const dur = p => `${mins(t(p.los) - t(p.aos))} min`;
const live = p => t(p.aos) <= NOW && NOW < t(p.los);
const until = p => live(p) ? `now, ${mins(t(p.los) - NOW)} min left`
  : mins(t(p.aos) - NOW) < 60 ? `in ${mins(t(p.aos) - NOW)} min` : clock(p.aos);
// The first voice frequency pair: what you'd set the radio to.
const freq = p => { const f = sats[p.norad].frequencies[0];
  return f ? `${f.mode} ↑${f.uplink_mhz?.toFixed(3) ?? '—'} ↓${f.downlink_mhz.toFixed(3)}` : ''; };
const upcoming = passes.filter(p => t(p.los) > NOW);

// Sky plot: the horizon is the rim, straight up the middle, north at the top.
function skyPlot(svg, list) {
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const S = Math.min(svg.clientWidth, svg.clientHeight), c = S / 2, R = c - 2.2 * rem;
  const xy = (az, el) => { const r = R * (90 - Math.max(el, 0)) / 90, a = az * Math.PI / 180;
    return [c + r * Math.sin(a), c - r * Math.cos(a)]; };
  let g = '';
  for (const el of [0, 30, 60]) g += `<circle cx="${c}" cy="${c}" r="${R * (90 - el) / 90}" fill="none" stroke="var(--line)"/>`;
  g += `<line x1="${c - R}" x2="${c + R}" y1="${c}" y2="${c}" stroke="var(--line)"/><line y1="${c - R}" y2="${c + R}" x1="${c}" x2="${c}" stroke="var(--line)"/>`;
  for (const [l, az] of [['N', 0], ['E', 90], ['S', 180], ['W', 270]]) {
    const [x, y] = xy(az, -12);
    g += `<text x="${x}" y="${y + 0.45 * rem}" text-anchor="middle" fill="var(--dim)" font-size="${1.3 * rem}">${l}</text>`;
  }
  list.forEach((p, n) => {
    if (!p.track) return;
    const pts = p.track.map(([, az, el]) => xy(az, el).join(',')).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${SERIES[n]}" stroke-width="2.5" stroke-linejoin="round"/>`;
    const [ax, ay] = xy(p.track[0][1], p.track[0][2]);
    g += `<circle cx="${ax}" cy="${ay}" r="${0.5 * rem}" fill="${SERIES[n]}" stroke="var(--panel)" stroke-width="2"/>`;
    g += `<text x="${ax}" y="${ay - 0.9 * rem}" text-anchor="middle" fill="var(--text)" font-size="${1.3 * rem}">${p.name}</text>`;
    if (live(p)) {   // where it is now
      const pt = p.track.reduce((a, b) => Math.abs(t(b[0]) - NOW) < Math.abs(t(a[0]) - NOW) ? b : a);
      const [x, y] = xy(pt[1], pt[2]);
      g += `<circle cx="${x}" cy="${y}" r="${0.9 * rem}" fill="var(--text)" stroke="${SERIES[n]}" stroke-width="3"/>`;
    }
  });
  svg.setAttribute('viewBox', `0 0 ${S} ${S}`);
  svg.innerHTML = g;
}

// Timeline: twelve hours, a lane per satellite, a bar per pass, labelled with its peak.
function timeline(svg) {
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const W = svg.clientWidth, H = svg.clientHeight, left = 7 * rem, top = 2 * rem;
  const span = 12 * 3600e3, x = ms => left + (W - left) * (ms - NOW) / span;
  const names = [...new Set(SNAPSHOT.satellites.map(s => s.name))];
  const lane = (H - top) / names.length;
  let g = '';
  for (let h = 0; h <= 12; h += 2) {
    const ms = NOW + h * 3600e3;
    g += `<line x1="${x(ms)}" x2="${x(ms)}" y1="${top - 0.4 * rem}" y2="${H}" stroke="var(--line)"/>`;
    g += `<text x="${x(ms)}" y="${1.3 * rem}" text-anchor="${h === 12 ? 'end' : h ? 'middle' : 'start'}" fill="var(--dim)" font-size="${1.2 * rem}">${h ? clock(new Date(ms).toISOString()) : 'Now'}</text>`;
  }
  names.forEach((n, i) => g += `<text x="0" y="${top + lane * i + lane / 2 + 0.5 * rem}" fill="var(--text)" font-size="${1.5 * rem}" font-weight="700">${n}</text>`);
  for (const p of upcoming) {
    if (t(p.aos) > NOW + span) continue;
    const i = names.indexOf(p.name), y0 = top + lane * i + lane * 0.2, x0 = Math.max(x(t(p.aos)), left), x1 = Math.min(x(t(p.los)), W);
    g += `<rect x="${x0}" y="${y0}" width="${Math.max(x1 - x0, 3)}" height="${lane * 0.6}" rx="3" fill="${live(p) ? 'var(--accent)' : SERIES[0]}" opacity="${0.35 + 0.65 * p.max_el / 90}"/>`;
    if (x1 + 3.4 * rem < W)
      g += `<text x="${x1 + 0.4 * rem}" y="${y0 + lane * 0.3 + 0.45 * rem}" fill="var(--dim)" font-size="${1.2 * rem}">${Math.round(p.max_el)}°</text>`;
  }
  svg.innerHTML = g;
}

const variants = {
  A: () => `<table class="ptbl"><tr><th>Satellite</th><th>When</th><th>Peak</th><th>Length</th><th>Path</th><th>Radio</th></tr>` +
    upcoming.slice(0, 10).map(p => `<tr class="${live(p) ? 'live' : ''}"><td class="sat">${p.name}</td>
      <td class="${live(p) ? 'now' : ''}">${until(p)}</td><td>${Math.round(p.max_el)}°</td><td>${dur(p)}</td>
      <td>${dir(p.aos_az)} → ${dir(p.los_az)}</td><td class="freq">${freq(p)}</td></tr>`).join('') + `</table>`,
  B: () => `<div class="split"><svg class="sky" data-sky="3"></svg><div class="list">` +
    upcoming.slice(0, 7).map((p, n) => `<div class="it"><span>${n < 3 ? `<i style="background:${SERIES[n]}"></i>` : ''}</span>
      <span class="sat">${p.name}</span><span class="${live(p) ? 'now' : ''}">${until(p)}</span><span>${Math.round(p.max_el)}°</span>
      <span class="sub">${dir(p.aos_az)} → ${dir(p.los_az)} · ${dur(p)} · ${freq(p)}</span></div>`).join('') + `</div></div>`,
  C: () => { const p = upcoming[0];
    return `<svg class="tl" data-timeline></svg><div class="detail">
      <span class="k">${live(p) ? 'Up now' : 'Next'}</span><span><b>${p.name}</b> · ${until(p)} · peak ${Math.round(p.max_el)}° · ${dir(p.aos_az)} → ${dir(p.los_az)}</span>
      <span class="k">Radio</span><span>${sats[p.norad].frequencies.map(f => `${f.mode} ↑${f.uplink_mhz?.toFixed(3) ?? '—'} ↓${f.downlink_mhz.toFixed(3)}`).join(' · ')}</span></div>`; },
  D: () => { const p = upcoming[0];
    return `<div class="hero"><svg class="sky" data-sky="1"></svg><div>
      <div class="k">${live(p) ? 'Up now' : 'Next pass'}</div><div class="big">${p.name}</div>
      <div class="when ${live(p) ? 'now' : ''}">${until(p)}</div>
      <div class="facts">Rises ${clock(p.aos)} in the ${dir(p.aos_az)}<br>Peaks ${Math.round(p.max_el)}° at ${clock(p.tca)}<br>Sets ${clock(p.los)} in the ${dir(p.los_az)}</div>
      <div class="freqs">${sats[p.norad].frequencies.map(f => `${f.description}<br>↑ ${f.uplink_mhz?.toFixed(3) ?? '—'} &nbsp; ↓ ${f.downlink_mhz.toFixed(3)} MHz ${f.mode}${f.inverting ? ', inverting' : ''}`).join('<br>')}</div>
    </div></div><div class="later">` + upcoming.slice(1, 6).map(q => `<div><div class="sat">${q.name}</div>
      <div class="t">${until(q)}</div><div class="sub">peak ${Math.round(q.max_el)}° · ${dur(q)}</div></div>`).join('') + `</div>`; },
};

const out = document.getElementById('out');
for (const [k, body] of Object.entries(variants)) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="label">${k}</div>` + ['tv', 'ipad'].map(size =>
    `<div><div class="box ${size}" id="${k}-${size}"><section class="panel feature">
       <h2>Satellite passes · next 24 h</h2><div class="feature-body">${body()}</div></section></div>
     <div class="measure" id="m-${k}-${size}"></div></div>`).join('');
  out.appendChild(row);
}
for (const svg of document.querySelectorAll('svg[data-sky]')) skyPlot(svg, upcoming.slice(0, +svg.dataset.sky));
for (const svg of document.querySelectorAll('svg[data-timeline]')) timeline(svg);

// Measured, in rem: smallest text, anything outside the panel, where content ends.
const remPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
for (const box of document.querySelectorAll('.box')) {
  const body = box.querySelector('.feature-body'), br = body.getBoundingClientRect();
  let min = Infinity, outside = 0, bottom = 0;
  for (const el of body.querySelectorAll('*')) {
    if ([...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim()))
      min = Math.min(min, parseFloat(el.getAttribute('font-size') || getComputedStyle(el).fontSize));
    const r = el.getBoundingClientRect();
    if (!r.height) continue;
    if (r.bottom > br.bottom + 1 || r.right > br.right + 1 || r.left < br.left - 1) outside++;
    bottom = Math.max(bottom, r.bottom);
  }
  document.getElementById('m-' + box.id).textContent =
    `${box.id}: min ${(min / remPx).toFixed(2)}rem, ${outside ? outside + ' outside' : 'fits'}, content ends at ${(100 * (bottom - br.top) / br.height).toFixed(0)}%`;
}
</script>
</body>
</html>
